<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Aster: Markdown viewer and editor">
  <title>Aster</title>
  <desc>Лист Markdown-документа с символом звёздочки — знаком Aster и разметки Markdown</desc>

  <defs>
    <!-- Фон иконки: глубокий синий, спокойный и хорошо читаемый в светлой и тёмной теме -->
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#263554"/>
      <stop offset="0.55" stop-color="#172138"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>

    <!-- Бумага: тёплый оттенок, контрастирующий с синим фоном -->
    <linearGradient id="paper" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.55" stop-color="#f8f1e4"/>
      <stop offset="1" stop-color="#e9dfcd"/>
    </linearGradient>

    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6d8c1"/>
      <stop offset="1" stop-color="#cdbb9f"/>
    </linearGradient>

    <!-- Акцент: янтарная звёздочка, как маркер Markdown и «aster» (звезда) -->
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="-100" y1="-110" x2="100" y2="110">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="206" r="252" fill="url(#glow)"/>

    <!-- Тонкая рамка по краю плитки -->
    <rect x="4" y="4" width="504" height="504" rx="108" fill="none"
          stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

    <!-- Лист документа с загнутым уголком -->
    <g filter="url(#shadow)">
      <path d="M160 72 H326 L392 138 V404 Q392 440 356 440 H156
               Q120 440 120 404 V108 Q120 72 156 72 Z"
            fill="url(#paper)"/>
      <path d="M326 72 L392 138 H356 Q326 138 326 108 Z" fill="url(#fold)"/>
      <path d="M160 72 H326 L392 138" fill="none"
            stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
    </g>

    <!-- Символ # в верхней части листа: знак заголовка Markdown -->
    <g stroke="#64748b" stroke-opacity="0.55" stroke-width="11"
       stroke-linecap="round">
      <line x1="176" y1="122" x2="176" y2="186"/>
      <line x1="208" y1="122" x2="208" y2="186"/>
      <line x1="158" y1="142" x2="224" y2="142"/>
      <line x1="158" y1="168" x2="224" y2="168"/>
    </g>

    <!-- Янтарная звёздочка: центр иконы -->
    <g transform="translate(256 296)">
      <g stroke="url(#accent)" stroke-opacity="0.35" stroke-width="40"
         stroke-linecap="round" filter="url(#starGlow)">
        <line x1="0" y1="-84" x2="0" y2="84"/>
        <line x1="-74" y1="-42" x2="74" y2="42"/>
        <line x1="74" y1="-42" x2="-74" y2="42"/>
      </g>
      <g stroke="url(#accent)" stroke-width="30" stroke-linecap="round">
        <line x1="0" y1="-84" x2="0" y2="84"/>
        <line x1="-74" y1="-42" x2="74" y2="42"/>
        <line x1="74" y1="-42" x2="-74" y2="42"/>
      </g>
      <circle cx="0" cy="0" r="12" fill="#fff7e6" opacity="0.95"/>
    </g>

    <!-- Строки текста под звёздочкой -->
    <g fill="#64748b" opacity="0.35">
      <rect x="160" y="402" width="126" height="9" rx="4.5"/>
      <rect x="160" y="420" width="82" height="9" rx="4.5"/>
    </g>

    <!-- Маленькая бирюзовая искра: акцент, не мешающий силуэту -->
    <path d="M400 174 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10 Z"
          fill="#5eead4" opacity="0.8"/>
  </g>
</svg>
